name: Windows online snapshot cost diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-snapshot-cost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Measure synthetic snapshot persistence costs
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64

      - name: Diagnose four synthetic FULL-durability persistence cases
        id: diagnostic
        timeout-minutes: 55
        env:
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/online-snapshot-cost
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $defaultTemp = python -c "import tempfile; print(tempfile.gettempdir())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DIAGNOSTIC_OUTPUT = Join-Path $defaultTemp 'online-snapshot-cost'
          "diagnostic_output=$env:DIAGNOSTIC_OUTPUT" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $env:DIAGNOSTIC_OUTPUT | Out-Null
          $record = [ordered]@{
            schema_version = 1
            kind = 'workflow_diagnostic_execution'
            status = 'incomplete'
            source_commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runtime_platform = $env:RUNNER_OS
            started_at = (Get-Date).ToUniversalTime().ToString('o')
            file_count = 200
            diagnostic_output = $env:DIAGNOSTIC_OUTPUT
            python_default_temp = $defaultTemp
            runner_temp = $env:RUNNER_TEMP
            journal_mode_sequence = @('DELETE', 'PERSIST', 'TRUNCATE', 'DELETE')
            synchronous = 'FULL'
            source_regression_acceptance = $false
            executable_acceptance = $false
            real_model_acceptance = $false
            office_acceptance = $false
            real_source_access = $false
            real_model_calls = $false
          }
          $executionPath = Join-Path $env:DIAGNOSTIC_OUTPUT 'WORKFLOW-EXECUTION.json'
          $record | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $executionPath -Encoding utf8
          python tools/diagnose_online_inventory_cost.py --repo-root . --output "$env:DIAGNOSTIC_OUTPUT" --files 200 2>&1 | Tee-Object -FilePath (Join-Path $env:DIAGNOSTIC_OUTPUT 'diagnostic.log')
          $toolExit = $LASTEXITCODE
          $record['exit_code'] = $toolExit
          $record['completed_at'] = (Get-Date).ToUniversalTime().ToString('o')
          if ($toolExit -eq 0) {
            $record['status'] = 'completed_diagnostic'
          } elseif ($toolExit -eq 130) {
            $record['status'] = 'incomplete'
          } else {
            $record['status'] = 'failed'
          }
          $record | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $executionPath -Encoding utf8
          if ($toolExit -ne 0) { exit $toolExit }

      - name: Preserve diagnostic progress, failures and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: online-snapshot-cost-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diagnostic.outputs.diagnostic_output }}
          if-no-files-found: error
          retention-days: 14
