name: Windows desktop x64

on:
  workflow_dispatch:
    inputs:
      compare_previous_candidates:
        description: Compare two pinned older Windows packages on the same runner
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow_lint:
    name: Validate Actions semantics before compiling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.4'
          cache: false
      - name: Check workflow context and expressions with pinned actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes= .github/workflows/windows-desktop.yml

  regression:
    name: Windows Python regressions ${{ matrix.shard }}
    runs-on: windows-2022
    needs: workflow_lint
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64

      - name: Fetch and verify the mandatory frozen public corpus
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          manifest = json.loads(Path('docs/eval/public-business-v1/manifest.json').read_text(encoding='utf-8'))
          target = Path(os.environ['RUNNER_TEMP']) / 'public-business-source'
          target.mkdir()
          for arguments in (['init'], ['config', 'core.autocrlf', 'false'],
                            ['remote', 'add', 'origin', manifest['repository']],
                            ['fetch', '--depth', '1', 'origin', manifest['commit']],
                            ['checkout', '--detach', 'FETCH_HEAD']):
              subprocess.run(['git', '-C', str(target), *arguments], check=True)
          actual = subprocess.check_output(['git', '-C', str(target), 'rev-parse', 'HEAD'], text=True).strip()
          if actual != manifest['commit']:
              raise SystemExit('Frozen public corpus revision mismatch.')
          for item in manifest['files']:
              if hashlib.sha256((target / item['path']).read_bytes()).hexdigest() != item['sha256']:
                  raise SystemExit('Frozen public corpus content mismatch.')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'PUBLIC_BUSINESS_SOURCE_ROOT={target}\n')

      - name: Fail fast on desktop acceptance and publication contracts
        shell: python
        run: |
          import subprocess
          import sys

          for pattern in ('test_workspace_graph_cache.py',
                          'test_activation_evidence.py', 'test_question_budget_delivery.py',
                          'test_prior_source_memory.py', 'test_web_app.py',
                          'test_cl_context.py', 'test_batch_context_evidence.py',
                          'test_answer_fact_completion.py', 'test_statement_io_clauses.py',
                          'test_frontend_io_boundaries.py',
                          'test_evidence_answer.py', 'test_evidence_context.py',
                          'test_business_accumulation.py',
                          'test_desktop_acceptance_runtime.py', 'test_desktop_build_contract.py',
                          'test_release_acceptance.py', 'test_publish_desktop_release.py',
                          'test_desktop_live_acceptance.py', 'test_desktop_candidate_collection.py',
                          'test_desktop_acceptance_cases.py'):
              subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'poc/tests',
                              '-p', pattern], check=True)

      - name: Run all assigned offline Python regressions
        timeout-minutes: 45
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python tools/run_python_regressions.py --shard-index $env:SHARD_INDEX --shard-count 4 --source-commit $env:GITHUB_SHA --output "$env:RUNNER_TEMP\python-regressions-$env:SHARD_INDEX.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve the complete regression shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-regressions-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-regressions-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Compile and verify Windows x64
    runs-on: windows-2022
    needs: [workflow_lint, regression]
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64

      - name: Download all regression reports for this revision and attempt
        uses: actions/download-artifact@v7
        with:
          pattern: python-regressions-${{ github.sha }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/python-regression-reports
          merge-multiple: true

      - name: Verify every Python test ran exactly once before compiling
        run: |
          python tools/check_python_regression_reports.py --reports-dir "$env:RUNNER_TEMP\python-regression-reports" --output "$env:RUNNER_TEMP\python-regressions-summary.json" --expected-shards 4 --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve the verified regression summary
        uses: actions/upload-artifact@v7
        with:
          name: python-regressions-summary-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-regressions-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Fetch and verify the mandatory frozen public corpus
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          manifest = json.loads(Path('docs/eval/public-business-v1/manifest.json').read_text(encoding='utf-8'))
          target = Path(os.environ['RUNNER_TEMP']) / 'public-business-source'
          target.mkdir()
          for arguments in (['init'], ['config', 'core.autocrlf', 'false'],
                            ['remote', 'add', 'origin', manifest['repository']],
                            ['fetch', '--depth', '1', 'origin', manifest['commit']],
                            ['checkout', '--detach', 'FETCH_HEAD']):
              subprocess.run(['git', '-C', str(target), *arguments], check=True)
          actual = subprocess.check_output(['git', '-C', str(target), 'rev-parse', 'HEAD'], text=True).strip()
          if actual != manifest['commit']:
              raise SystemExit('Frozen public corpus revision mismatch.')
          for item in manifest['files']:
              if hashlib.sha256((target / item['path']).read_bytes()).hexdigest() != item['sha256']:
                  raise SystemExit('Frozen public corpus content mismatch.')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'PUBLIC_BUSINESS_SOURCE_ROOT={target}\n')

      - name: Check Windows compiler and build target
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'Visual Studio locator is missing.' }
          $compiler = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $compiler) { throw 'MSVC x64 build tools are missing.' }
          python build_app.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the isolated desktop build environment
        id: prepare
        shell: python
        run: |
          from argparse import Namespace
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd()))
          from build_app import prepare_environment

          interpreter = prepare_environment(Namespace(skip_install=False))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'interpreter={interpreter}\n')

      - name: Check source browser runtime without model calls
        env:
          BUILD_PYTHON: ${{ steps.prepare.outputs.interpreter }}
        run: |
          & $env:BUILD_PYTHON poc/desktop_app.py --browser --self-test --data-dir "$env:RUNNER_TEMP\source-self-test-profile" --self-test-result "$env:RUNNER_TEMP\source-self-test.json"
          $selfTestCode = $LASTEXITCODE
          if ($selfTestCode -ne 0) {
            $diagnostic = Join-Path $env:RUNNER_TEMP 'source-self-test-profile\desktop.log'
            if (Test-Path -LiteralPath $diagnostic) { Get-Content -LiteralPath $diagnostic -Tail 40 }
            exit $selfTestCode
          }

      - name: Run browser regressions
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          tests = sorted(str(path) for path in Path('poc/tests').glob('*.test.cjs'))
          if not tests:
              raise SystemExit('No browser regression tests were found.')
          subprocess.run(['node', '--test', *tests], check=True)

      - name: Compile with MSVC and verify the compiled runtime
        run: python build_app.py --skip-install --jobs 4 --output-dir release

      - name: Exercise final EXE through the default workbench and enforce joint acceptance
        timeout-minutes: 45
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          archives = list(Path('release/windows-x64').glob('*/COBOLWorkbench-windows-x64.zip'))
          if len(archives) != 1:
              raise SystemExit('Expected exactly one Windows x64 delivery ZIP.')
          archive = archives[0]
          manifest = Path('docs/eval/desktop-joint-v1/manifest.json')
          temporary = Path(os.environ['RUNNER_TEMP'])
          output = temporary / 'compiled-joint-acceptance'
          policy = temporary / 'candidate-policy.json'
          policy.write_text(json.dumps({'schema_version': 'release-acceptance-policy/v1',
              'source_commit': os.environ['GITHUB_SHA'],
              'manifest_sha256': hashlib.sha256(manifest.read_bytes()).hexdigest()}), encoding='utf-8')
          subprocess.run([sys.executable, 'tools/desktop_acceptance.py', '--archive', str(archive),
              '--source-commit', os.environ['GITHUB_SHA'], '--public-source', os.environ['PUBLIC_BUSINESS_SOURCE_ROOT'],
              '--manifest', str(manifest), '--output', str(output)], check=True)
          subprocess.run([sys.executable, 'tools/collect_desktop_candidate.py', '--package', str(archive),
              '--report', str(output / 'COMPILED-ACCEPTANCE.json'), '--manifest', str(manifest),
              '--policy', str(policy), '--destination', 'windows-delivery'], check=True)
          report = json.loads((output / 'COMPILED-ACCEPTANCE.json').read_text(encoding='utf-8'))
          summary = (f'Windows native EXE joint offline acceptance passed for `{os.environ["GITHUB_SHA"]}`.\n\n'
                     f'Samples: {len(report["cases"])}. ZIP SHA-256: `{report["archive_sha256"]}`.\n\n'
                     'This is a candidate: synthetic provider results do not measure real-model accuracy. '
                     'Formal publication remains blocked until the same ZIP has bound real-model, human, '
                     'and target office-device acceptance. No release is published by this workflow.\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write(summary)

      - name: Compare pinned previous candidates on this same Windows runner
        if: ${{ inputs.compare_previous_candidates }}
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          temporary = Path(os.environ['RUNNER_TEMP'])
          subprocess.run([sys.executable, 'tools/compare_native_release_performance.py',
              '--repository', os.environ['GITHUB_REPOSITORY'],
              '--current-archive', 'windows-delivery/COBOLWorkbench-windows-x64.zip',
              '--current-report', str(temporary / 'compiled-joint-acceptance/COMPILED-ACCEPTANCE.json'),
              '--source-commit', os.environ['GITHUB_SHA'],
              '--manifest', 'docs/eval/desktop-joint-v1/manifest.json',
              '--public-source', os.environ['PUBLIC_BUSINESS_SOURCE_ROOT'],
              '--output', str(temporary / 'native-release-performance')], check=True)

      - name: Preserve same-runner performance reports separately
        if: ${{ always() && inputs.compare_previous_candidates }}
        uses: actions/upload-artifact@v7
        with:
          name: native-release-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-release-performance/NATIVE-PERFORMANCE.json
            ${{ runner.temp }}/native-release-performance/OPTIMIZED-ACCEPTANCE.json
            ${{ runner.temp }}/native-release-performance/previous/acceptance/COMPILED-ACCEPTANCE.json
            ${{ runner.temp }}/native-release-performance/current/acceptance/COMPILED-ACCEPTANCE.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload only the accepted candidate and its bound reports
        uses: actions/upload-artifact@v7
        with:
          name: COBOLWorkbench-windows-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            windows-delivery/COBOLWorkbench-windows-x64.zip
            windows-delivery/COBOLWorkbench-windows-x64.zip.sha256
            windows-delivery/BUILD-INFO.json
            windows-delivery/COMPILED-ACCEPTANCE.json
            windows-delivery/CANDIDATE-GATE.json
            windows-delivery/ACCEPTANCE-MANIFEST.json
            windows-delivery/CANDIDATE-POLICY.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          include-hidden-files: false

      - name: Preserve sanitized offline failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-native-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compiled-joint-acceptance/COMPILED-ACCEPTANCE.json
          if-no-files-found: ignore
          retention-days: 14
